<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bgPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="bgCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Flower Symbol Definition -->
    <g id="single-flower">
      <!-- Leaves -->
      <g opacity="0.8">
        <path d="M 0,0 C -20,-30 -30,-70 0,-90 C 30,-70 20,-30 0,0 Z" fill="url(#bgLeafGrad)"/>
        <path d="M 0,0 C -25,-15 -60,-20 -75,5 C -60,25 -25,15 0,0 Z" fill="url(#bgLeafGrad)"/>
        <path d="M 0,0 C 25,-15 60,-20 75,5 C 60,25 25,15 0,0 Z" fill="url(#bgLeafGrad)"/>
      </g>
      <!-- Petals 8-direction -->
      <g opacity="0.95">
        <path d="M 0,0 C -22,-15 -28,-50 0,-72 C 28,-50 22,-15 0,0 Z" fill="url(#bgPetalGrad)" stroke="#CBD5E1" stroke-width="0.8" stroke-opacity="0.3"/>
        <path d="M 0,0 C -15,-22 -50,-28 -72,0 C -50,28 -15,22 0,0 Z" fill="url(#bgPetalGrad)" stroke="#CBD5E1" stroke-width="0.8" stroke-opacity="0.3"/>
        <path d="M 0,0 C -22,15 -28,50 0,72 C 28,50 22,15 0,0 Z" fill="url(#bgPetalGrad)" stroke="#CBD5E1" stroke-width="0.8" stroke-opacity="0.3"/>
        <path d="M 0,0 C 15,-22 50,-28 72,0 C 50,28 15,22 0,0 Z" fill="url(#bgPetalGrad)" stroke="#CBD5E1" stroke-width="0.8" stroke-opacity="0.3"/>
        
        <!-- Diagonals -->
        <g transform="rotate(45)">
          <path d="M 0,0 C -18,-12 -24,-42 0,-62 C 24,-42 18,-12 0,0 Z" fill="url(#bgPetalGrad)" stroke="#E2E8F0" stroke-width="0.6" stroke-opacity="0.25"/>
          <path d="M 0,0 C -12,-18 -42,-24 -62,0 C -42,24 -12,18 0,0 Z" fill="url(#bgPetalGrad)" stroke="#E2E8F0" stroke-width="0.6" stroke-opacity="0.25"/>
          <path d="M 0,0 C -18,12 -24,42 0,62 C 24,42 18,12 0,0 Z" fill="url(#bgPetalGrad)" stroke="#E2E8F0" stroke-width="0.6" stroke-opacity="0.25"/>
          <path d="M 0,0 C 12,-18 42,-24 62,0 C 42,24 12,18 0,0 Z" fill="url(#bgPetalGrad)" stroke="#E2E8F0" stroke-width="0.6" stroke-opacity="0.25"/>
        </g>
      </g>
      <!-- Center -->
      <circle cx="0" cy="0" r="14" fill="url(#bgCenterGrad)"/>
      <circle cx="0" cy="0" r="7" fill="#FEF08A" fill-opacity="0.6"/>
    </g>

    <!-- Bud Symbol -->
    <g id="bud">
      <path d="M 0,20 C -10,10 -15,-10 0,-25 C 15,-10 10,10 0,20 Z" fill="url(#bgPetalGrad)" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.3"/>
      <path d="M 0,20 C -6,15 -10,5 -6,-5 C -2,-12 0,20 0,20 Z" fill="url(#bgLeafGrad)"/>
      <path d="M 0,20 C 6,15 10,5 6,-5 C 2,-12 0,20 0,20 Z" fill="url(#bgLeafGrad)"/>
    </g>

    <!-- Floating Petal -->
    <g id="floating-petal">
      <path d="M 0,0 C -14,-10 -18,-32 0,-45 C 18,-32 14,-10 0,0 Z" fill="url(#bgPetalGrad)" stroke="#E2E8F0" stroke-width="0.6" stroke-opacity="0.3"/>
    </g>
  </defs>

  <!-- Corner Motif Top-Right -->
  <g transform="translate(1750, 80) scale(1.6)" opacity="0.85">
    <use href="#single-flower" />
  </g>
  <g transform="translate(1860, 220) scale(1.1) rotate(35)" opacity="0.7">
    <use href="#single-flower" />
  </g>
  <g transform="translate(1620, 160) scale(0.9) rotate(-25)" opacity="0.65">
    <use href="#single-flower" />
  </g>
  <g transform="translate(1550, 70) scale(1.2) rotate(60)" opacity="0.6">
    <use href="#bud" />
  </g>

  <!-- Corner Motif Bottom-Left -->
  <g transform="translate(120, 960) scale(1.8) rotate(15)" opacity="0.85">
    <use href="#single-flower" />
  </g>
  <g transform="translate(270, 1020) scale(1.2) rotate(-40)" opacity="0.75">
    <use href="#single-flower" />
  </g>
  <g transform="translate(80, 800) scale(1.0) rotate(50)" opacity="0.65">
    <use href="#single-flower" />
  </g>
  <g transform="translate(230, 840) scale(1.3) rotate(-15)" opacity="0.6">
    <use href="#bud" />
  </g>

  <!-- Center subtle watermark flower -->
  <g transform="translate(960, 540) scale(3.2) rotate(20)" opacity="0.35">
    <use href="#single-flower" />
  </g>

  <!-- Graceful Scattered Petals -->
  <g transform="translate(480, 320) scale(0.9) rotate(42)" opacity="0.6"><use href="#floating-petal"/></g>
  <g transform="translate(720, 180) scale(0.7) rotate(-35)" opacity="0.5"><use href="#floating-petal"/></g>
  <g transform="translate(1240, 280) scale(1.0) rotate(80)" opacity="0.55"><use href="#floating-petal"/></g>
  <g transform="translate(1420, 480) scale(0.8) rotate(120)" opacity="0.6"><use href="#floating-petal"/></g>
  <g transform="translate(640, 780) scale(1.1) rotate(-65)" opacity="0.55"><use href="#floating-petal"/></g>
  <g transform="translate(1280, 820) scale(0.9) rotate(30)" opacity="0.6"><use href="#floating-petal"/></g>
  <g transform="translate(1520, 890) scale(0.7) rotate(-110)" opacity="0.45"><use href="#floating-petal"/></g>
  <g transform="translate(380, 620) scale(0.8) rotate(95)" opacity="0.5"><use href="#floating-petal"/></g>
</svg>